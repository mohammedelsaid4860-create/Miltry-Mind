<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>جاري التحضير...</title>
    <style>
        body { background: #030406; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; flex-direction: column; font-family: sans-serif; }
        button { padding: 15px 30px; font-size: 20px; background: #4b5320; color: white; border: none; border-radius: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <h1>جاري تجهيز طلبك...</h1>
    <button onclick="startChain()">اضغط للمتابعة</button>

    <script>
        // هنا تضع الروابط الخاصة بك
        const site1 = "https://omg10.com/4/10438181"; // الموقع الأول
        const site2 = "https://www.bing.com";   // الموقع الثاني

        function startChain() {
            // تخزين الحالة في المتصفح عشان نعرف إحنا فين
            localStorage.setItem('redirect_step', 'step1');
            
            // فتح الموقع الأول
            window.location.href = site1;
        }

        // كود بسيط لاكتشاف عودة المستخدم
        window.addEventListener('focus', () => {
            if (localStorage.getItem('redirect_step') === 'step1') {
                localStorage.setItem('redirect_step', 'step2');
                // بعد العودة يفتح الموقع الثاني تلقائياً (سيحاول المتصفح حظره، لذا يفضل إظهار زر جديد)
                alert("جاري الانتقال للخطوة التالية...");
                window.location.href = site2;
            }
        });
    </script>
</body>
</html>
